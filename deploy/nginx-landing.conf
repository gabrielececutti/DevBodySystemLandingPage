# Nginx site config for the DevBodySystem landing page.
# Replace YOUR_HOSTNAME (e.g. 203-0-113-10.sslip.io), then copy to
# /etc/nginx/sites-available/landing and enable it.
# Certbot adds the HTTPS (443) block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_HOSTNAME;

    root /var/www/landing;
    index index.html;

    # Never serve the git folder or deploy files
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(svg|png|jpg|jpeg|webp|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
